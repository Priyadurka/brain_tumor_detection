{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Register</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input type="text"
                       class="form-control"
                       name="username"
                       required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       class="form-control"
                       name="email"
                       required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       class="form-control"
                       name="password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>

</div>

{% endblock %}
