{% extends 'base.html' %}

{% block title %}
Prediction Result
{% endblock %}


{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4 text-center">

        <h2>
            🧠 Brain Tumor Detection Result
        </h2>


        <img src="{{ image.image.url }}"
             class="img-fluid rounded mt-3"
             style="width:300px;">


        <h4 class="mt-4">
            Prediction:
        </h4>


        <h2 class="text-success">
            {{ prediction }}
        </h2>


        <a href="{% url 'upload' %}" 
           class="btn btn-primary mt-3">
            Upload Another MRI
        </a>

    </div>

</div>

{% endblock %}
